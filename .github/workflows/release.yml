name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install dependencies
        run: corepack npm ci --ignore-scripts
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi
      - name: Verify source and package
        run: corepack npm run check:ci
      - name: Pack release artifact
        id: pack
        run: |
          mkdir release-package
          corepack npm pack --pack-destination release-package --json > package-pack.json
          PACKAGE_FILE="$(node --input-type=module -e "import fs from 'node:fs'; const result = JSON.parse(fs.readFileSync('package-pack.json', 'utf8')); process.stdout.write(result[0].filename)")"
          node scripts/ci/generate-sbom.mjs "release-package/$PACKAGE_FILE.cdx.json"
          (cd release-package && sha256sum "$PACKAGE_FILE" "$PACKAGE_FILE.cdx.json" > SHA256SUMS)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
      - name: Upload exact release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            release-package/${{ steps.pack.outputs.file }}
            release-package/${{ steps.pack.outputs.file }}.cdx.json
            release-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-failure
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Download exact release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: npm-package
          path: release-package
      - name: Resolve release package
        id: package
        run: |
          mapfile -t PACKAGE_FILES < <(find release-package -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#PACKAGE_FILES[@]}" -ne 1 ]]; then
            echo "Expected one package archive, found ${#PACKAGE_FILES[@]}." >&2
            exit 1
          fi
          {
            echo "file=${PACKAGE_FILES[0]}"
            echo "sbom=${PACKAGE_FILES[0]}.cdx.json"
            echo "checksums=release-package/SHA256SUMS"
          } >> "$GITHUB_OUTPUT"
      - name: Verify release artifact checksums
        working-directory: release-package
        run: sha256sum --check SHA256SUMS
      - name: Attest release artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.sbom }}
            ${{ steps.package.outputs.checksums }}
      - name: Install pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          ARCHIVE="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate MCP Registry metadata
        run: mcp-publisher validate server.json
      - name: Publish or verify npm package
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: node scripts/release/publish-npm.mjs "$PACKAGE_FILE"
      - name: Publish or verify MCP Registry metadata
        run: node scripts/release/publish-registry.mjs
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          SBOM_FILE: ${{ steps.package.outputs.sbom }}
          CHECKSUMS_FILE: ${{ steps.package.outputs.checksums }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$SBOM_FILE" "$CHECKSUMS_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" "$SBOM_FILE" "$CHECKSUMS_FILE" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
