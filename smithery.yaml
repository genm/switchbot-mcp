# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

build:
  dockerBuildPath: ./
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - switchbotToken
      - switchbotSecret
    properties:
      switchbotToken:
        type: string
        description: SwitchBot Open API token.
      switchbotSecret:
        type: string
        description: SwitchBot Open API secret.
      switchbotTimeoutMs:
        type: number
        description: HTTP timeout in milliseconds (default 10000).
      switchbotListCacheTtlMs:
        type: number
        description: Cache TTL for list tools in milliseconds (default 30000).
      logLevel:
        type: string
        enum: [debug, info, warn, error]
        description: Log level (default info).
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        SWITCHBOT_TOKEN: config.switchbotToken,
        SWITCHBOT_SECRET: config.switchbotSecret,
        SWITCHBOT_TIMEOUT_MS: String(config.switchbotTimeoutMs ?? 10000),
        SWITCHBOT_LIST_CACHE_TTL_MS: String(config.switchbotListCacheTtlMs ?? 30000),
        LOG_LEVEL: config.logLevel ?? 'info',
        MCP_TRANSPORT: 'stdio'
      }
    })
